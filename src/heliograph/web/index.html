<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="heliograph-token" content="__TOKEN__">
<title>Heliograph</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v=__V__">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 18V6a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v2"/><path d="M3 18l2.5-7.2A2 2 0 0 1 7.4 9.5H21a1 1 0 0 1 .95 1.3L19.6 17.5A2 2 0 0 1 17.7 19H5a2 2 0 0 1-2-1z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-4.5-4.5L6 21"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="13" height="13" rx="2"/><path d="m21.5 8-6 4 6 4z"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-all" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4.5h3.5v15H7zM13.5 4.5H17v15h-3.5z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4.5V11h-6.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><rect x="8" y="9" width="8" height="6" rx="1"/></symbol>
    <symbol id="i-drive" viewBox="0 0 24 24"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13 7.5 5h9L19 13M17 16.5h.01"/></symbol>
    <symbol id="i-convert" viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="m17 9 5 6M22 9l-5 6"/></symbol>
    <symbol id="i-subs" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 11h4M13 11h4M7 15h7M16 15h1"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m6 5 9 7-9 7z"/><path d="M19 5v14"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="m12 13 4-5"/></symbol>
    <symbol id="i-tracks" viewBox="0 0 24 24"><path d="M4 8h16M4 12h10M4 16h13"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.7 2.4c-.8.4-1.2 1-1.2 1.9"/><path d="M12 17.2h.01"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-5 6-7 10-9"/></symbol>
  </defs>
</svg>

<div id="app">
  <aside id="side" aria-label="Library">
    <div class="brand">
      <img src="/static/icon.svg" alt="" width="28" height="28">
      <span>Heliograph</span>
    </div>
    <div class="openbar">
      <button id="btn-folder" class="btn" type="button" title="Open a folder  ( Ctrl+O )"><svg class="ic sm"><use href="#i-folder-open"/></svg>Open folder</button>
      <button id="btn-file" class="btn" type="button" title="Open a file  ( Ctrl+Shift+O )"><svg class="ic sm"><use href="#i-file"/></svg>Open file</button>
    </div>
    <nav id="nav">
      <div class="sec" id="nav-library"></div>
      <div class="sec" id="nav-smart"></div>
      <div class="sec" id="nav-time"></div>
      <div class="sec" id="nav-folders"></div>
      <div class="sec" id="nav-opened"></div>
    </nav>
    <div id="status" class="status" role="status"></div>
    <div class="aboutbar">
      <button id="btn-help" class="linkbtn" type="button" title="Keyboard shortcuts and tips  ( ? )"><svg class="ic sm"><use href="#i-help"/></svg>Help</button>
      <button id="btn-about" class="linkbtn" type="button" title="About Heliograph"><svg class="ic sm"><use href="#i-info"/></svg>About</button>
    </div>
  </aside>

  <main id="main">
    <header id="bar">
      <div class="titles">
        <h1 id="title">Heliograph</h1>
        <div id="sub" class="subtitle"></div>
      </div>
      <div class="tools">
        <div class="seg" id="kinds" role="group" aria-label="Show">
          <button data-kind="" type="button">All</button>
          <button data-kind="image" type="button">Pictures</button>
          <button data-kind="video" type="button">Videos</button>
          <button data-kind="audio" type="button">Audio</button>
        </div>
        <button id="subs" class="chip" type="button" aria-pressed="true" hidden title="Show media from all folders inside this one">Include subfolders</button>
        <select id="group" aria-label="Group by"></select>
        <select id="sort" aria-label="Sort by"></select>
        <label class="size" title="Thumbnail size">
          <svg class="ic sm"><use href="#i-image"/></svg>
          <input id="tile" type="range" min="110" max="360" step="10" value="190" aria-label="Thumbnail size">
        </label>
        <button id="fit" class="iconbtn" type="button" aria-pressed="false" title="Show whole picture in each tile"><svg class="ic"><use href="#i-fit"/></svg></button>
        <label class="search">
          <svg class="ic sm"><use href="#i-search"/></svg>
          <input id="q" type="search" placeholder="Search  ( / )" autocomplete="off" spellcheck="false" aria-label="Search">
        </label>
        <button id="btn-jobs" class="iconbtn" type="button" title="Conversions" aria-label="Conversions"><svg class="ic"><use href="#i-convert"/></svg><span id="jobs-badge" class="badge" hidden></span></button>
      </div>
    </header>
    <div id="banner" class="banner" hidden>
      <span>The library has changed.</span>
      <button id="banner-go" type="button">Refresh</button>
    </div>
    <div id="folders" class="folders" hidden></div>
    <div id="loadbar" class="loadbar" hidden><i></i></div>
    <div id="scrollwrap">
      <div id="scroll" tabindex="0" aria-label="Media">
        <div id="content"></div>
        <div id="empty" class="empty" hidden></div>
      </div>
      <div id="stick" class="ghead stick" hidden></div>
    </div>
    <div id="selbar" class="selbar" hidden>
      <span id="sel-n"></span>
      <button id="sel-convert" class="btn primary" type="button"><svg class="ic sm"><use href="#i-convert"/></svg>Convert…</button>
      <button id="sel-fav" class="btn" type="button"><svg class="ic sm"><use href="#i-star"/></svg>Favourite</button>
      <button id="sel-all" class="btn" type="button">Select all</button>
      <button id="sel-clear" class="btn" type="button">Clear</button>
    </div>
  </main>
</div>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-label="Viewer">
  <div class="vbar">
    <div class="vtitle"><span id="v-name"></span><span id="v-count" class="vcount"></span></div>
    <div class="vtools">
      <button id="v-convert" class="iconbtn" type="button" title="Convert  ( Shift+C )"><svg class="ic"><use href="#i-convert"/></svg></button>
      <button id="v-fav" class="iconbtn" type="button" title="Favourite  ( S )"><svg class="ic"><use href="#i-star"/></svg></button>
      <button id="v-help" class="iconbtn" type="button" title="Help and shortcuts  ( ? )" aria-label="Help and shortcuts"><svg class="ic"><use href="#i-help"/></svg></button>
      <button id="v-info" class="iconbtn" type="button" aria-pressed="false" title="Details  ( I )"><svg class="ic"><use href="#i-info"/></svg></button>
      <button id="v-full" class="iconbtn" type="button" title="Full screen  ( F )"><svg class="ic"><use href="#i-full"/></svg></button>
      <button id="v-close" class="iconbtn" type="button" title="Close  ( Esc )"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
  </div>
  <div class="vbody">
    <div id="stage" class="stage"></div>
    <button id="v-prev" class="vnav prev" type="button" aria-label="Previous"><svg class="ic lg"><use href="#i-left"/></svg></button>
    <button id="v-next" class="vnav next" type="button" aria-label="Next"><svg class="ic lg"><use href="#i-right"/></svg></button>
    <aside id="vinfo" class="vinfo" hidden></aside>
  </div>
</div>

<div id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title">Open a folder</h2>
    <div id="m-quick" class="quick"></div>
    <form id="m-form" class="pathrow">
      <button id="m-up" type="button" class="iconbtn" title="Parent folder"><svg class="ic"><use href="#i-up"/></svg></button>
      <input id="m-path" type="text" spellcheck="false" aria-label="Folder path" autocomplete="off">
    </form>
    <div id="m-list" class="dirlist" role="listbox" aria-label="Folders"></div>
    <div class="dialog-foot">
      <span id="m-hint" class="hint"></span>
      <button id="m-cancel" type="button" class="btn">Cancel</button>
      <button id="m-add" type="button" class="btn">Add to library</button>
      <button id="m-open" type="button" class="btn primary">Open</button>
    </div>
  </div>
</div>

<div id="convert" hidden>
  <div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="c-title">
    <h2 id="c-title">Convert</h2>
    <p id="c-sub"></p>
    <div id="c-body" class="cbody"></div>
    <div class="dialog-foot">
      <span id="c-hint" class="hint"></span>
      <button id="c-cancel" type="button" class="btn">Cancel</button>
      <button id="c-go" type="button" class="btn primary">Start</button>
    </div>
  </div>
</div>

<div id="help" hidden>
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="h-title">
    <div class="help-head">
      <h2 id="h-title">Heliograph</h2>
      <div id="h-tabs" class="tabs" role="tablist" aria-label="Help">
        <button type="button" role="tab" data-tab="keys" aria-selected="true">Shortcuts</button>
        <button type="button" role="tab" data-tab="about" aria-selected="false" tabindex="-1">About</button>
      </div>
      <button id="h-close" class="iconbtn" type="button" aria-label="Close  ( Esc )" title="Close  ( Esc )"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div id="h-body" class="help-body" role="tabpanel"></div>
  </div>
</div>

<aside id="jobs" class="jobs" hidden aria-label="Conversions">
  <div class="jobs-head"><h2>Conversions</h2><button id="jobs-clear" class="btn" type="button">Clear finished</button><button id="jobs-close" class="iconbtn" type="button" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div id="jobs-list" class="jobs-list"></div>
</aside>

<div id="down" hidden>
  <div class="dialog">
    <h2>The library service stopped</h2>
    <p>It shuts down by itself after a while with no window open. Start it again with <code>heliograph</code> from a terminal or the app launcher. This window reconnects on its own.</p>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/static/main.js?v=__V__"></script>
</body>
</html>
